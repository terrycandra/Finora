<main><header><button id="mb" class="b" data-a="menu" aria-label="Buka menu">Menu</button><h1 id="ttl"></h1><div id="act" class="np"></div></header><section id="pg"></section></main>
<div id="md"></div><div id="ts" aria-live="polite"></div>
<script>
(()=>{
const K='finora_v1',$=s=>document.querySelector(s),R=n=>'Rp'+new Intl.NumberFormat('id-ID').format(Math.round(n)),uid=()=>Math.random().toString(36).slice(2,9);
const p2=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=()=>fmt(new Date()),mo=d=>d.slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ml=n=>{const o=[],d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);o.push(x.getFullYear()+'-'+p2(x.getMonth()+1))}return o};
const pmo=m=>{const[y,n]=m.split('-').map(Number),x=new Date(y,n-2,1);return x.getFullYear()+'-'+p2(x.getMonth()+1)};

const PAL=['#3478E5','#18A66A','#E35A61','#F2A93B','#7A5AF8','#0EA5B7','#8D98AE','#D6568F','#6B8E23'];
const TYPES=['Cash','Bank','E-Wallet','Savings','Investment','Other Assets'],LIQ=['Cash','Bank','E-Wallet','Savings'];
const blank=()=>({v:1,name:'',theme:'light',accounts:[],tx:[],cats:['Food & Beverage','Transportation','Shopping','Bills & Utilities','Entertainment','Education','Personal','Business Expense','Other','Salary','Business','Other Income'],rules:[],budgets:{},goals:[],ar:[],ap:[]});
let S=null;try{const j=JSON.parse(localStorage.getItem(K));if(j&&j.v===1)S=j}catch(e){}
let first=!S,page='ov',F={q:'',type:'',acc:'',cat:'',m:'',s:'d'},RM=mo(today());
if(!S)S=blank();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Gagal menyimpan: penyimpanan browser penuh/diblokir')}};

function toast(m){const e=document.createElement('div');e.className='t';e.textContent=m;$('#ts').append(e);setTimeout(()=>e.remove(),2600)}
/* ---------- logika keuangan (terpisah dari UI) ---------- */
const acc=id=>S.accounts.find(a=>a.id===id),an=id=>acc(id)?.name||'-',live=()=>S.accounts.filter(a=>!a.arch);
const balAt=(a,end)=>S.tx.reduce((s,t)=>{if(end&&t.date>end)return s;
 if(t.type==='inc'||t.type==='adj')return t.acc===a.id?s+t.amt:s;
 if(t.type==='exp')return t.acc===a.id?s-t.amt:s;
 if(t.type==='trf')return t.acc===a.id?s-t.amt:t.to===a.id?s+t.amt:s;return s},a.open);
const bal=a=>balAt(a);
const msum=(m,ty)=>S.tx.filter(t=>t.type===ty&&mo(t.date)===m).reduce((s,t)=>s+t.amt,0);
const ebycat=m=>{const o={};S.tx.filter(t=>t.type==='exp'&&mo(t.date)===m).forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);return o};
const ibycat=m=>{const o={};S.tx.filter(t=>t.type==='inc'&&mo(t.date)===m).forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);return o};
const out=i=>i.amt-i.pays.reduce((s,p)=>s+p.amt,0),sumOut=l=>l.reduce((s,i)=>s+out(i),0);
const st=i=>out(i)<=0?'Paid':i.due<today()?'Overdue':i.pays.length?'Partial':'Pending';
const liquid=()=>live().filter(a=>LIQ.includes(a.type)).reduce((s,a)=>s+bal(a),0);
const sr=(i,e)=>i?(i-e)/i*100:null,srt=v=>v==null?'N/A':v.toFixed(1)+'%';
function validate(){const o=S.accounts.reduce((s,a)=>s+a.open,0)+S.tx.reduce((s,t)=>t.type==='inc'||t.type==='adj'?s+t.amt:t.type==='exp'?s-t.amt:s,0),b=S.accounts.reduce((s,a)=>s+bal(a),0);return o===b}
/* ---------- kategori & smart input ---------- */
const RULES=[[/bensin|pertalite|pertamax|grab|gojek|parkir|tol|ojek|kereta/,'Transportation'],[/makan|kopi|minum|resto|bakso|nasi|snack|jajan/,'Food & Beverage'],[/listrik|internet|pulsa|wifi|air pdam|token/,'Bills & Utilities'],[/belanja|shopee|tokopedia|baju|lazada/,'Shopping'],[/operasional|bahan baku|sewa toko/,'Business Expense'],[/buku|kuliah|kursus|spp/,'Education'],[/bioskop|game|netflix|nonton|spotify/,'Entertainment']];
const catOf=(l,type)=>{for(const r of S.rules)if(l.includes(r.k.toLowerCase()))return r.c;if(type==='inc')return/gaji|salary/.test(l)?'Salary':'Other Income';for(const[r,c]of RULES)if(r.test(l))return c;return'Other'};
function parse(txt){const l=txt.toLowerCase(),m=l.match(/(\d{1,3}(?:\.\d{3})+|\d+(?:,\d+)?)\s*(juta|jt|ribu|rb|k)?/);let amt=0;
 if(m){amt=parseFloat(m[1].replace(/\./g,'').replace(',','.'));const u=m[2];amt*=/juta|jt/.test(u||'')?1e6:/ribu|rb|k/.test(u||'')?1e3:1;amt=Math.round(amt)}
 const type=/transfer|pindah saldo|kirim saldo|top ?up|isi saldo/.test(l)?'trf':/gaji|masuk|terima|dapat|salary|pemasukan|dibayar/.test(l)?'inc':'exp';
 const A=live(),after=w=>{const i=l.indexOf(w);if(i<0)return null;let b=null,bi=1e9;A.forEach(a=>{const j=l.indexOf(a.name.toLowerCase(),i+w.length);if(j>=0&&j<bi){bi=j;b=a}});return b};
 let a1=null,a2='';
 if(type==='trf'){a1=after('dari ');const d=after(' ke ')||after('top up')||after('isi saldo');a2=d&&d!==a1?d.id:'';if(!a1){const f=A.filter(a=>l.includes(a.name.toLowerCase()));a1=f.find(a=>a.id!==a2)||null}}
 else a1=after('pakai ')||after('pake ')||after('dari ')||after(' ke ')||after('via ')||A.find(a=>l.includes(a.name.toLowerCase()))||null;
 const d=/kemarin/.test(l)?fmt(new Date(Date.now()-864e5)):today();
 const desc=txt.replace(/\s+(pakai|pake|via|dari|ke)\s+.*$/i,'').replace(/\s*hari ini|\s*kemarin/i,'').trim()||txt;
 return{type,date:d,amt:amt||'',desc,cat:type==='trf'?'Transfer':catOf(l,type),acc:(a1||A[0]||{}).id,to:a2,notes:'Smart Input: '+txt,tags:''}}
/* ---------- UI helper ---------- */
const fld=(l,n,v='',t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const sel=(l,n,o,v,x='')=>`<label>${l}<select name="${n}" ${x}>${o.map(q=>{const[a,b]=Array.isArray(q)?q:[q,q];return`<option value="${esc(a)}"${a===v?' selected':''}>${esc(b)}</option>`}).join('')}</select></label>`;
const closeM=()=>$('#md').innerHTML='';
function modal(t,h,fn,ok='Simpan'){$('#md').innerHTML=`<div class="ov"><form class="mc cd" role="dialog" aria-modal="true" aria-label="${esc(t)}"><h3>${t}</h3>${h}<div class="ra"><button type="button" class="b" data-a="x">Batal</button><button class="b p">${ok}</button></div></form></div>`;const f=$('#md form');f.onsubmit=e=>{e.preventDefault();if(fn(Object.fromEntries(new FormData(f)))!==false)closeM()};f.querySelector('input,select')?.focus()}
const conf=(m,fn)=>modal('Konfirmasi',`<p>${m}</p>`,()=>{fn()},'Ya, lanjutkan');
const empty=(t,d,a,b)=>`<div class="cd em"><h3>${t}</h3><p class="mu">${d}</p><button class="b p" data-a="${a}">${b}</button></div>`;
const csv=(rows,name)=>{const c=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download=name;a.click()};
const K1=(l,v,c='')=>`<div class="cd"><small>${l}</small><div class="v ${c}">${v}</div></div>`;
const pbar=(p,c)=>`<div class="pb"><i style="width:${Math.min(100,Math.max(0,p))}%;${c?'background:'+c:''}"></i></div>`;
/* ---------- form transaksi ---------- */
function txForm(t,done){t=t||{type:'exp',date:today(),amt:'',desc:'',cat:'',acc:live()[0]?.id,to:'',notes:'',tags:''};
 if(!live().length)return toast('Buat akun terlebih dahulu');
 const ao=live().map(a=>[a.id,a.name]);
 modal(t.id?'Edit transaksi':'Transaksi baru',sel('Jenis','type',[['inc','Income'],['exp','Expense'],['trf','Transfer'],['adj','Penyesuaian saldo (+/−)']],t.type)+fld('Tanggal','date',t.date,'date','required')+fld('Nominal (Rp)','amt',t.amt,'number','required step="1"')+fld('Deskripsi','desc',t.desc,'text','required')+fld('Kategori (boleh ketik baru)','cat',t.cat,'text','list="cl"')+`<datalist id="cl">${S.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist>`+sel('Akun (sumber)','acc',ao,t.acc)+sel('Akun tujuan (khusus transfer)','to',[['','—'],...ao],t.to)+fld('Catatan','notes',t.notes)+fld('Tags (pisahkan koma)','tags',t.tags),
 d=>{const a=Math.round(+d.amt);if(!a||(d.type!=='adj'&&a<0)){toast('Nominal tidak valid');return false}
  if(d.type==='trf'&&(!d.to||d.to===d.acc)){toast('Pilih akun tujuan yang berbeda');return false}
  const o={...t,...d,amt:a,to:d.type==='trf'?d.to:'',cat:d.cat||(d.type==='trf'?'Transfer':'Other')};o.id=t.id||uid();
  if(d.cat&&!S.cats.includes(d.cat)&&d.type!=='trf')S.cats.push(d.cat);
  S.tx=t.id?S.tx.map(x=>x.id===t.id?o:x):[...S.tx,o];commit('Transaksi disimpan')})}
function delTx(id){const t=S.tx.find(x=>x.id===id);S.tx=S.tx.filter(x=>x.id!==id);['ar','ap'].forEach(k=>S[k].forEach(i=>i.pays=i.pays.filter(p=>p.tx!==id)));commit('Transaksi dihapus. Saldo dihitung ulang')}
/* ---------- insight & kesehatan ---------- */
function insights(m){const o=[],inc=msum(m,'inc'),ex=msum(m,'exp'),eb=ebycat(m),pe=ebycat(pmo(m)),top=Object.entries(eb).sort((a,b)=>b[1]-a[1])[0];
 if(!inc&&!ex)return['Belum ada transaksi pada bulan ini.'];
 o.push(ex>inc?'Pengeluaran bulan ini lebih besar daripada pemasukan.':'Cashflow kamu positif bulan ini.');
 if(top)o.push(`Kategori ${top[0]} menjadi pengeluaran terbesar (${R(top[1])}).`);
 Object.entries(S.budgets).forEach(([c,b])=>{const p=(eb[c]||0)/b*100;if(p>=80)o.push(`Budget ${c} telah mencapai ${Math.round(p)}%.`)});
 Object.entries(eb).forEach(([c,v])=>{if(pe[c]&&v>pe[c]*1.3&&v-pe[c]>50000)o.push(`Pengeluaran ${c} naik dibanding bulan lalu (${R(pe[c])} → ${R(v)}).`)});
 if(S.ar.some(i=>st(i)==='Overdue'))o.push('Ada piutang yang melewati jatuh tempo.');
 if(S.ap.some(i=>st(i)==='Overdue'))o.push('Ada utang yang melewati jatuh tempo.');
 if(ex)o.push(`Saldo liquid saat ini dapat menutupi sekitar ${(liquid()/ex).toFixed(1)} bulan pengeluaran, berdasarkan data bulan ini.`);
 return o}
function health(){const m=mo(today()),inc=msum(m,'inc'),ex=msum(m,'exp'),s=sr(inc,ex),mm=ex?liquid()/ex:null,eb=ebycat(m),bk=Object.keys(S.budgets),over=bk.filter(c=>(eb[c]||0)>S.budgets[c]),ao=S.ar.some(i=>st(i)==='Overdue'),po=S.ap.some(i=>st(i)==='Overdue'),cl=(v,a=0,b=20)=>Math.max(a,Math.min(b,v));
 return[['Cashflow',inc?cl(20*inc/Math.max(ex,1)):0,inc?(inc>=ex?'Pemasukan menutup pengeluaran.':'Pengeluaran melebihi pemasukan.'):'Belum ada pemasukan tercatat bulan ini.','Catat pemasukan bulan ini atau kurangi pengeluaran.'],
 ['Savings rate',s==null?0:cl(s),'Savings rate: '+srt(s),'Targetkan menyisihkan minimal 20% pemasukan.'],
 ['Dana darurat',mm==null?0:cl(mm/6*20),mm==null?'Belum ada pengeluaran untuk dibandingkan.':`Saldo liquid ≈ ${mm.toFixed(1)} bulan pengeluaran.`,'Bangun saldo liquid hingga 6 bulan pengeluaran.'],
 ['Disiplin budget',bk.length?20*(1-over.length/bk.length):10,bk.length?(over.length?'Over budget: '+over.join(', '):'Semua budget terkendali.'):'Belum ada budget (nilai netral 10).','Tetapkan budget untuk kategori utama.'],
 ['Risiko piutang/utang',20-(ao?10:0)-(po?10:0),ao||po?'Ada tagihan melewati jatuh tempo.':'Tidak ada yang overdue.','Tagih piutang dan lunasi utang yang jatuh tempo.']]}
/* ---------- halaman ---------- */
const P={
ov(){const A=live(),by=t=>A.filter(a=>a.type===t).reduce((s,a)=>s+bal(a),0),cm=mo(today()),inc=msum(cm,'inc'),ex=msum(cm,'exp'),ast=A.reduce((s,a)=>s+bal(a),0)+sumOut(S.ar),lb=sumOut(S.ap);
 if(!S.accounts.length)return empty('Mulai dengan menambahkan akun pertamamu','Buat akun seperti Cash, Bank, atau DANA, lalu catat transaksi pertamamu.','add-ac','Tambah akun');
 const M=ml(6),mx=Math.max(1,...M.map(m=>Math.max(msum(m,'inc'),msum(m,'exp'))));
 const bars=M.map((m,i)=>{const x=10+i*58,h1=msum(m,'inc')/mx*100,h2=msum(m,'exp')/mx*100;return`<rect x="${x}" y="${110-h1}" width="22" height="${h1}" rx="4" fill="#18A66A"/><rect x="${x+24}" y="${110-h2}" width="22" height="${h2}" rx="4" fill="#E35A61"/><text x="${x+23}" y="126" font-size="9" text-anchor="middle" fill="#778197">${m.slice(5)}/${m.slice(2,4)}</text>`}).join('');
 const eb=ebycat(cm),tot=Object.values(eb).reduce((a,b)=>a+b,0);let c0=0;const en=Object.entries(eb).sort((a,b)=>b[1]-a[1]);
 const grad=en.map(([k,v],i)=>{const s=c0;c0+=v/tot*100;return`${PAL[i%9]} ${s}% ${c0}%`}).join(',');
 const rec=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
 return`<div class="g">${K1('Total Assets',R(ast))}${K1('Total Liabilities',R(lb))}${K1('Net Worth',R(ast-lb),ast-lb>=0?'ok':'er')}${K1('Total Cash',R(by('Cash')))}${K1('Total Bank',R(by('Bank')))}${K1('Total E-Wallet',R(by('E-Wallet')))}${K1('Total Investment',R(by('Investment')))}${K1('Income bulan ini',R(inc),'ok')}${K1('Expense bulan ini',R(ex),'er')}${K1('Net Cashflow',R(inc-ex),inc-ex>=0?'ok':'er')}${K1('Savings Rate',srt(sr(inc,ex)))}</div>
 <small class="mu">Assets = saldo akun aktif + piutang berjalan. Liabilities = utang berjalan.</small>
 <div class="g g2" style="margin-top:12px"><div class="cd"><h3>Income vs Expense (6 bulan)</h3><svg viewBox="0 0 360 132" width="100%" role="img" aria-label="Grafik pemasukan dan pengeluaran">${bars}</svg><small><span class="ok">■</span> Income &nbsp;<span class="er">■</span> Expense</small></div>
 <div class="cd"><h3>Expense Breakdown (bulan ini)</h3>${tot?`<div class="lg"><div class="dn" style="background:conic-gradient(${grad})"></div><div>${en.slice(0,6).map(([k,v],i)=>`<div><i style="background:${PAL[i%9]}"></i>${esc(k)} <b>${Math.round(v/tot*100)}%</b></div>`).join('')}</div></div>`:'<p class="mu">Belum ada pengeluaran bulan ini.</p>'}</div></div>
 <div class="g g2"><div class="cd"><h3>Saldo akun</h3>${A.map(a=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(a.name)} <small>${a.type}</small></span><b>${R(bal(a))}</b></div>`).join('')}</div>
 <div class="cd"><h3>Insight</h3><ul class="in">${insights(cm).map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div></div>
 <div class="g g2"><div class="cd"><h3>Transaksi terbaru</h3>${rec.length?rec.map(t=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(t.desc)} <small>${t.date}</small></span>${amt(t)}</div>`).join(''):'<p class="mu">Belum ada transaksi.</p>'}</div>

{t:'Compound Interest',d:'Bunga majemuk bulanan, setoran di akhir bulan.',f:[['Modal awal (Rp)','p',10000000],['Setoran bulanan (Rp)','c',1000000],['Bunga per tahun (%)','r',6],['Durasi (tahun)','y',10]],fn:v=>{const i=v.r/1200,n=v.y*12,g=k=>i?v.p*(1+i)**k+v.c*((1+i)**k-1)/i:v.p+v.c*k,fv=g(n),cap=v.p+v.c*n;let t='';for(let y=1;y<=Math.min(v.y,30);y++)t+=`<tr><td>Tahun ${y}</td><td class="r">${R(g(y*12))}</td></tr>`;return`<b>Future value ${R(fv)}</b><br>Total modal ${R(cap)} · Estimasi pertumbuhan ${R(fv-cap)}<div class="tw"><table>${t}</table></div>`}},
